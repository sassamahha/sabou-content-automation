name: Post note

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NOTE_STATE_B64: ${{ secrets.NOTE_STATE_B64 }}   # ← if で使うためにenvへ
    concurrency:
      group: note-post
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: sassamahha/sabou-content-automation
          path: content-repo
          fetch-depth: 0
          # private で落ちる場合:
          # token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (Python + Playwright)
        run: |
          python -m pip install -U pip
          python -m pip install -r note-auto/requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Debug — show files
        run: |
          pwd
          ls -la
          echo "--- note-auto ---"
          ls -la note-auto || true
          echo "--- content-repo ---"
          ls -la content-repo/posts/sabou | head -n 50 || true

      - name: Restore storage state (optional)
        if: ${{ env.NOTE_STATE_B64 != '' }}
        run: |
          mkdir -p note-auto
          echo "${{ env.NOTE_STATE_B64 }}" | base64 -d > note-auto/state.json

      - name: Post to note
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          DEBUG: pw:api
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          python note-auto/post_to_note.py

      - name: Upload artifacts (screenshots/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            note-auto/artifacts/**
            note-auto/screenshots/**
            note-auto/traces/**
          if-no-files-found: ignore
