name: Post note

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"   # 毎日12:00 JST

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12        # ← 必ず吊り切る
    concurrency:
      group: note-post
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Checkout content repo
        uses: actions/checkout@v4
        with:
          repository: sassamahha/sabou-content-automation
          path: content-repo
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install -r note-auto/requirements.txt

      # ← Playwright公式アクションでChromium依存/Xvfbを面倒見てもらう
      - uses: microsoft/playwright-github-action@v1

      - name: Debug — show files
        run: |
          pwd
          ls -la
          echo "--- note-auto ---"
          ls -la note-auto || true
          echo "--- content-repo ---"
          ls -la content-repo/posts/sabou | head -n 50 || true

      # （任意）ログイン状態の再利用：Secretsに NOTE_STATE_B64 を入れている場合だけ復元
      - name: Restore storage state (optional)
        if: ${{ secrets.NOTE_STATE_B64 != '' }}
        run: |
          mkdir -p note-auto
          echo "${{ secrets.NOTE_STATE_B64 }}" | base64 -d > note-auto/state.json

      - name: Post to note
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          DEBUG: pw:api                   # ← Playwrightの詳細ログ
          PLAYWRIGHT_BROWSERS_PATH: 0
        run: |
          python note-auto/post_to_note.py

      # 落ちたら証拠を必ず回収
      - name: Upload artifacts (screenshots/traces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            note-auto/artifacts/**
            note-auto/screenshots/**
            note-auto/traces/**
          if-no-files-found: ignore
